# Production profile — usado em Docker/Fly.io
# Activar com: --spring.profiles.active=prod
# ou env var: SPRING_PROFILES_ACTIVE=prod

# Base de dados SQLite — caminho para volume persistente
db.type=SQLITE
db.sqlite.path=/data/musical-trainer.db

# Desactivar H2 console em producao
spring.h2.console.enabled=false

# Frontend servido do diretório local (copiado para /app/frontend no Docker)
spring.web.resources.static-locations=file:frontend/

# Logging mais reduzido em producao
logging.level.root=WARN
logging.level.pt.uab.musicaltrainer=INFO
logging.file.name=logs/musical-trainer-prod.log
