# Spring Boot Application Configuration
spring.application.name=musical-trainer

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:musicaltrainerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (for development/testing)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL Initialization
# 'embedded' runs schema.sql only for embedded DBs (H2). Safe for production SQLite/PostgreSQL.
spring.sql.init.mode=embedded
spring.sql.init.data-locations=classpath:schema.sql

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.pt.uab.musicaltrainer=DEBUG

# Log file pattern: logs/yyyy-MM-ddThh-mm-ss.log
logging.file.name=logs/musical-trainer-${spring.application.name:app}-${spring.profiles.active:dev}.log
logging.file.max-size=10MB
logging.file.max-history=30

# Log pattern: timestamp [level] logger - message
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss} [%level] %logger{30} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss} [%level] %logger{30} - %msg%n

# Database configuration
db.type=H2

# PostgreSQL Configuration (when db.type=POSTGRES)
db.postgres.host=localhost
db.postgres.port=5432
db.postgres.database=musical_trainer
db.postgres.username=postgres
db.postgres.password=

# Frontend static resources (ADR-017)
# Serve /frontend/ directory at / — change to classpath:static/ or CDN URL for production
spring.web.resources.static-locations=file:frontend/

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
