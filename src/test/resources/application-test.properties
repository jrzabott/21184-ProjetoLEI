# Test Profile Configuration
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql

# Test Logging Configuration
logging.level.root=WARN
logging.level.pt.uab.musicaltrainer=DEBUG

# Test logs to file with timestamp
logging.file.name=logs/musical-trainer-test-${spring.application.name:app}.log
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss} [%level] %logger{30} - %msg%n

# Database configuration for tests
db.type=H2
